<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Video & 3D ASCII Studio - Python</title>
  
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #030408;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 5px 0 12px 0;
    }
    .panel {
      background: #141824;
      padding: 12px 18px;
      border-radius: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1px solid #2d3748;
      max-width: 1150px;
    }
    select, input[type="text"] {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #4a5568;
      background: #1f2738;
      color: white;
      font-weight: 500;
      cursor: pointer;
    }
    input[type="text"] {
      min-width: 170px;
      cursor: text;
    }
    button, label.btn {
      padding: 8px 14px;
      border-radius: 6px;
      background: #3182ce;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    button:hover, label.btn:hover {
      background: #2b6cb0;
    }
    .rec-btn {
      background: #e53e3e;
    }
    .rec-btn:hover {
      background: #c53030;
    }
    .rec-active {
      background: #dd6b20 !important;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.65; }
      100% { opacity: 1; }
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      background: #1f2738;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #2d3748;
    }
    #asciiWrapper {
      background: #030308;
      border-radius: 10px;
      border: 1px solid #2d3748;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas#renderCanvas {
      display: block;
    }
    video {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Color Video & 3D ASCII Studio (Python)</h1>

  <div class="panel">
    <div class="control-group">
      <label for="demoSelect">Mode:</label>
      <select id="demoSelect" onchange="selectDemo(this.value)">
        <option value="sun_moon">Sun & Moon 3D</option>
        <option value="donut">3D Spinning Donut</option>
        <option value="matrix">Matrix Digital Rain</option>
        <option value="plasma">Cyber Plasma Wave</option>
      </select>
    </div>

    <label class="btn">
      Upload Video (.mp4)
      <input type="file" id="fileInput" accept="video/*" style="display: none;" py-change="load_file">
    </label>

    <input type="text" id="videoUrl" placeholder="Direct .mp4 URL...">
    <button py-click="load_url">Load URL</button>

    <div class="control-group">
      <label for="fontSize">Size:</label>
      <input type="range" id="fontSize" min="9" max="20" value="13">
    </div>

    <div class="control-group">
      <label for="colorMode">Color:</label>
      <input type="checkbox" id="colorMode" checked>
    </div>

    <button id="recBtn" class="rec-btn" onclick="toggleVideoRecording()">Start Recording Video</button>
    <button py-click="download_ascii" style="background: #2f855a;">Save Frame (.txt)</button>
  </div>

  <div id="asciiWrapper">
    <canvas id="renderCanvas" width="1150" height="650"></canvas>
  </div>

  <video id="sourceVideo" loop muted playsinline crossorigin="anonymous"></video>
  <canvas id="hiddenCanvas" style="display: none;"></canvas>

  <!-- Konfiguracja PyScript do ładowania zewnętrznego pliku demos.py -->
  <script type="py" config='{"files": {"./demos.py": "./demos.py"}}'>
import math
import random
from js import document, window, URL, Blob
from pyodide.ffi import create_proxy
import demos

video = document.getElementById("sourceVideo")
hidden_canvas = document.getElementById("hiddenCanvas")
hidden_ctx = hidden_canvas.getContext("2d", { "willReadFrequently": True })

render_canvas = document.getElementById("renderCanvas")
ctx = render_canvas.getContext("2d")

ASCII_CHARS = " .':;!*=#$@"
last_txt_frame = ""

def selectDemo(demoName):
    window.currentAsciiMode = demoName
    if demoName != "video":
        video.pause()

window.selectDemo = selectDemo
window.currentAsciiMode = "sun_moon"

def load_file(event):
    files = document.getElementById("fileInput").files
    if files.length > 0:
        file = files.item(0)
        video.src = URL.createObjectURL(file)
        window.currentAsciiMode = "video"
        video.play()

def load_url(event):
    url = document.getElementById("videoUrl").value.strip()
    if not url:
        return
    if "youtube.com" in url or "youtu.be" in url or "tiktok.com" in url:
        window.alert("YouTube/TikTok links are web pages, not direct .mp4 files. Please download the video first and click 'Upload Video (.mp4)'.")
        return
    video.src = url
    window.currentAsciiMode = "video"
    video.play()

def main_loop(timestamp=0):
    global last_txt_frame
    mode = window.currentAsciiMode
    font_size = int(document.getElementById("fontSize").value)
    use_color = document.getElementById("colorMode").checked

    W = render_canvas.width
    H = render_canvas.height

    ctx.fillStyle = "#030408"
    ctx.fillRect(0, 0, W, H)
    ctx.font = f"bold {font_size}px 'Courier New', monospace"

    if mode == "sun_moon":
        demos.render_sun_moon(ctx, W, H, font_size, use_color, ASCII_CHARS)
    elif mode == "donut":
        last_txt_frame = demos.render_donut(ctx, W, H, font_size, use_color, ASCII_CHARS)
    elif mode == "matrix":
        demos.render_matrix(ctx, W, H, font_size, use_color)
    elif mode == "plasma":
        last_txt_frame = demos.render_plasma(ctx, W, H, font_size, use_color, ASCII_CHARS)
    elif mode == "video" and not video.paused and not video.ended and video.videoWidth > 0:
        char_w = max(5, int(font_size * 0.62))
        char_h = font_size
        cols = W // char_w
        rows = H // char_h

        hidden_canvas.width = cols
        hidden_canvas.height = rows
        hidden_ctx.drawImage(video, 0, 0, cols, rows)
        img_data = hidden_ctx.getImageData(0, 0, cols, rows).data

        txt_rows = []
        chars_max = len(ASCII_CHARS) - 1

        for y in range(rows):
            row_str = []
            pos_y = (y + 1) * char_h
            for x in range(cols):
                idx = (y * cols + x) * 4
                r = img_data[idx]
                g = img_data[idx + 1]
                b = img_data[idx + 2]

                lum = int(0.299 * r + 0.587 * g + 0.114 * b)
                ch = ASCII_CHARS[int((lum / 255.0) * chars_max)]
                row_str.append(ch)

                if lum > 12:
                    if use_color:
                        ctx.fillStyle = f"rgb({r},{g},{b})"
                    else:
                        ctx.fillStyle = f"rgb({lum},{lum},{lum})"
                    ctx.fillText(ch, x * char_w, pos_y)
            txt_rows.append("".join(row_str))
        last_txt_frame = "\n".join(txt_rows)

    window.requestAnimationFrame(create_proxy(main_loop))

def download_ascii(event):
    content = last_txt_frame if last_txt_frame else "ASCII Studio Frame"
    blob = Blob.new([content], { "type": "text/plain;charset=utf-8" })
    a = document.createElement("a")
    a.href = URL.createObjectURL(blob)
    a.download = "ascii_art.txt"
    a.click()

main_loop()
  </script>

  <!-- Skrypt nagrywania wideo -->
  <script>
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function toggleVideoRecording() {
      const canvas = document.getElementById("renderCanvas");
      const recBtn = document.getElementById("recBtn");

      if (!isRecording) {
        recordedChunks = [];
        const stream = canvas.captureStream(30);

        let mimeType = "video/webm;codecs=vp9";
        let ext = "mp4";
        if (MediaRecorder.isTypeSupported("video/mp4")) {
          mimeType = "video/mp4";
          ext = "mp4";
        } else if (MediaRecorder.isTypeSupported("video/webm")) {
          mimeType = "video/webm";
          ext = "webm";
        }

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: mimeType,
          videoBitsPerSecond: 8000000
        });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `ascii_animation.${ext}`;
          a.click();
          URL.revokeObjectURL(url);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.textContent = "Stop & Save Video";
        recBtn.classList.add("rec-active");
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.textContent = "Start Recording Video";
        recBtn.classList.remove("rec-active");
      }
    }
  </script>
</body>
</html>
