<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Video & 3D ASCII Studio - Python</title>
  
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

  <style>
    body {
      margin: 0;
      background-color: #06070b;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 5px 0 12px 0;
    }
    .panel {
      background: #141824;
      padding: 12px 18px;
      border-radius: 10px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      border: 1px solid #2d3748;
      max-width: 1150px;
    }
    select, input[type="text"] {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #4a5568;
      background: #1f2738;
      color: white;
      font-weight: 500;
      cursor: pointer;
    }
    input[type="text"] {
      min-width: 170px;
      cursor: text;
    }
    button, label.btn {
      padding: 8px 14px;
      border-radius: 6px;
      background: #3182ce;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    button:hover, label.btn:hover {
      background: #2b6cb0;
    }
    .rec-btn {
      background: #e53e3e;
    }
    .rec-btn:hover {
      background: #c53030;
    }
    .rec-active {
      background: #dd6b20 !important;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.65; }
      100% { opacity: 1; }
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      background: #1f2738;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #2d3748;
    }
    #asciiWrapper {
      background: #030308;
      border-radius: 10px;
      border: 1px solid #2d3748;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas#renderCanvas {
      display: block;
    }
    video {
      display: none;
    }
  </style>
</head>
<body>

  <h1>Color Video & 3D ASCII Studio (Python)</h1>

  <div class="panel">
    <!-- Rozwijana lista z wyborami trybów -->
    <div class="control-group">
      <label for="demoSelect">Mode:</label>
      <select id="demoSelect" onchange="selectDemo(this.value)">
        <option value="sun_moon">Sun & Moon 3D</option>
        <option value="donut">3D Spinning Donut</option>
        <option value="matrix">Matrix Digital Rain</option>
        <option value="plasma">Cyber Plasma Wave</option>
      </select>
    </div>

    <label class="btn">
      Upload Video (.mp4)
      <input type="file" id="fileInput" accept="video/*" style="display: none;" py-change="load_file">
    </label>

    <input type="text" id="videoUrl" placeholder="Direct .mp4 URL...">
    <button py-click="load_url">Load URL</button>

    <div class="control-group">
      <label for="fontSize">Size:</label>
      <input type="range" id="fontSize" min="9" max="20" value="13">
    </div>

    <div class="control-group">
      <label for="colorMode">Color:</label>
      <input type="checkbox" id="colorMode" checked>
    </div>

    <button id="recBtn" class="rec-btn" onclick="toggleVideoRecording()">Start Recording Video</button>
    <button py-click="download_ascii" style="background: #2f855a;">Save Frame (.txt)</button>
  </div>

  <div id="asciiWrapper">
    <canvas id="renderCanvas" width="1150" height="650"></canvas>
  </div>

  <video id="sourceVideo" loop muted playsinline crossorigin="anonymous"></video>
  <canvas id="hiddenCanvas" style="display: none;"></canvas>

  <!-- Skrypt obsługujący rozwijaną listę i nagrywanie wideo -->
  <script>
    window.currentAsciiMode = "sun_moon";

    function selectDemo(demoName) {
      window.currentAsciiMode = demoName;
      const v = document.getElementById("sourceVideo");
      if (v) v.pause();
    }

    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;

    function toggleVideoRecording() {
      const canvas = document.getElementById("renderCanvas");
      const recBtn = document.getElementById("recBtn");

      if (!isRecording) {
        recordedChunks = [];
        const stream = canvas.captureStream(30);

        let mimeType = "video/webm;codecs=vp9";
        let ext = "mp4";
        if (MediaRecorder.isTypeSupported("video/mp4")) {
          mimeType = "video/mp4";
          ext = "mp4";
        } else if (MediaRecorder.isTypeSupported("video/webm")) {
          mimeType = "video/webm";
          ext = "webm";
        }

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: mimeType,
          videoBitsPerSecond: 8000000
        });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `ascii_animation.${ext}`;
          a.click();
          URL.revokeObjectURL(url);
        };

        mediaRecorder.start();
        isRecording = true;
        recBtn.textContent = "Stop & Save Video";
        recBtn.classList.add("rec-active");
      } else {
        mediaRecorder.stop();
        isRecording = false;
        recBtn.textContent = "Start Recording Video";
        recBtn.classList.remove("rec-active");
      }
    }
  </script>

  <!-- Silnik Pythona (PyScript) -->
  <script type="py">
import math
import random
from js import document, window, URL, Blob
from pyodide.ffi import create_proxy

video = document.getElementById("sourceVideo")
hidden_canvas = document.getElementById("hiddenCanvas")
hidden_ctx = hidden_canvas.getContext("2d", { "willReadFrequently": True })

render_canvas = document.getElementById("renderCanvas")
ctx = render_canvas.getContext("2d")

ASCII_CHARS = " .':;!*=#$@"
MATRIX_CHARS = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*+<>"

last_txt_frame = ""

stars = [
    {
        "x": random.randint(10, 1140),
        "y": random.randint(10, 640),
        "char": random.choice(["+", ".", "*", "x"])
    }
    for _ in range(75)
]
angle_sun = 0.0
angle_moon = 0.0

donut_A = 0.0
donut_B = 0.0

matrix_drops = [random.randint(-30, 60) for _ in range(180)]
plasma_time = 0.0

def load_file(event):
    files = document.getElementById("fileInput").files
    if files.length > 0:
        file = files.item(0)
        video.src = URL.createObjectURL(file)
        window.currentAsciiMode = "video"
        video.play()

def load_url(event):
    url = document.getElementById("videoUrl").value.strip()
    if not url:
        return
    if "youtube.com" in url or "youtu.be" in url or "tiktok.com" in url:
        window.alert("YouTube/TikTok links are web pages, not direct .mp4 files. Please download the video first and click 'Upload Video (.mp4)'.")
        return
    video.src = url
    window.currentAsciiMode = "video"
    video.play()

def draw_demo_sphere(cx, cy, radius, angle_y, base_col, light_dir, font_size, use_color):
    lx, ly, lz = light_dir
    l_len = math.sqrt(lx*lx + ly*ly + lz*lz)
    lx, ly, lz = lx/l_len, ly/l_len, lz/l_len

    cos_y, sin_y = math.cos(angle_y), math.sin(angle_y)
    step_y = int(font_size * 0.85)
    step_x = int(font_size * 0.6)
    r_int = int(radius)

    for y in range(-r_int, r_int + 1, step_y):
        for x in range(-r_int, r_int + 1, step_x):
            d_sq = x*x + y*y
            if d_sq <= radius*radius:
                z = math.sqrt(radius*radius - d_sq)
                nx, ny, nz = x/radius, y/radius, z/radius

                rx = nx * cos_y + nz * sin_y
                ry = ny
                rz = -nx * sin_y + nz * cos_y

                diff = max(0.0, rx*lx + ry*ly + rz*lz)
                char_idx = int(diff * (len(ASCII_CHARS) - 1))
                ch = ASCII_CHARS[char_idx]

                if use_color:
                    r = int(base_col[0] * (0.15 + 0.85 * diff))
                    g = int(base_col[1] * (0.15 + 0.85 * diff))
                    b = int(base_col[2] * (0.15 + 0.85 * diff))
                    ctx.fillStyle = f"rgb({r},{g},{b})"
                else:
                    v = int(255 * diff)
                    ctx.fillStyle = f"rgb({v},{v},{v})"

                ctx.fillText(ch, cx + x, cy + y)

def render_donut(W, H, font_size, use_color):
    global donut_A, donut_B, last_txt_frame
    char_w = max(6, int(font_size * 0.62))
    char_h = font_size
    cols = W // char_w
    rows = H // char_h

    zbuffer = [0.0] * (cols * rows)
    output = [" "] * (cols * rows)
    colors = [(0, 0, 0)] * (cols * rows)

    cosA, sinA = math.cos(donut_A), math.sin(donut_A)
    cosB, sinB = math.cos(donut_B), math.sin(donut_B)

    theta = 0.0
    while theta < 6.28:
        costheta, sintheta = math.cos(theta), math.sin(theta)
        phi = 0.0
        while phi < 6.28:
            cosphi, sinphi = math.cos(phi), math.sin(phi)

            circlex = 2.0 + 1.0 * costheta
            circley = 1.0 * sintheta

            x = circlex * (cosB * cosphi + sinA * sinB * sinphi) - circley * cosA * sinB
            y = circlex * (sinB * cosphi - sinA * cosB * sinphi) + circley * cosA * cosB
            z = 5.0 + cosA * circlex * sinphi + circley * sinA
            ooz = 1.0 / z

            xp = int(cols / 2 + (cols * 0.38) * ooz * x)
            yp = int(rows / 2 - (rows * 0.55) * ooz * y)

            L = cosphi * costheta * sinB - cosA * costheta * sinphi - sinA * sintheta + cosB * (cosA * sintheta - costheta * sinA * sinphi)

            if L > 0 and 0 <= xp < cols and 0 <= yp < rows:
                idx = xp + yp * cols
                if ooz > zbuffer[idx]:
                    zbuffer[idx] = ooz
                    lum_idx = min(len(ASCII_CHARS) - 1, int(L * 8))
                    output[idx] = ASCII_CHARS[lum_idx]
                    r = int(128 + 127 * math.sin(theta))
                    g = int(128 + 127 * math.sin(phi))
                    b = int(200 + 55 * costheta)
                    factor = min(1.0, L / 1.4)
                    colors[idx] = (int(r * factor), int(g * factor), int(b * factor))
            phi += 0.09
        theta += 0.22

    txt_rows = []
    for r_idx in range(rows):
        row_chars = []
        pos_y = (r_idx + 1) * char_h
        for c_idx in range(cols):
            i = c_idx + r_idx * cols
            ch = output[i]
            row_chars.append(ch)
            if ch != " ":
                if use_color:
                    rc, gc, bc = colors[i]
                    ctx.fillStyle = f"rgb({rc},{gc},{bc})"
                else:
                    ctx.fillStyle = "#e2e8f0"
                ctx.fillText(ch, c_idx * char_w, pos_y)
        txt_rows.append("".join(row_chars))

    last_txt_frame = "\n".join(txt_rows)
    donut_A += 0.06
    donut_B += 0.04

def render_matrix(W, H, font_size, use_color):
    global last_txt_frame
    char_w = max(6, int(font_size * 0.65))
    char_h = font_size
    cols = min(len(matrix_drops), W // char_w)
    rows = H // char_h

    for c in range(cols):
        head_y = matrix_drops[c]
        for tail in range(16):
            ry = head_y - tail
            if 0 <= ry < rows:
                ch = random.choice(MATRIX_CHARS)
                if tail == 0:
                    ctx.fillStyle = "#ffffff"
                else:
                    intensity = max(35, int(255 * (1 - tail / 16)))
                    if use_color:
                        ctx.fillStyle = f"rgb(0, {intensity}, 65)"
                    else:
                        ctx.fillStyle = f"rgb({intensity}, {intensity}, {intensity})"
                ctx.fillText(ch, c * char_w, (ry + 1) * char_h)

        matrix_drops[c] += 1
        if matrix_drops[c] - 16 > rows and random.random() > 0.92:
            matrix_drops[c] = random.randint(-15, 0)

def render_plasma(W, H, font_size, use_color):
    global plasma_time, last_txt_frame
    char_w = max(6, int(font_size * 0.65))
    char_h = font_size
    cols = W // char_w
    rows = H // char_h

    txt_rows = []
    chars_max = len(ASCII_CHARS) - 1

    for y in range(rows):
        row_chars = []
        pos_y = (y + 1) * char_h
        ny = y * 0.12
        for x in range(cols):
            nx = x * 0.08
            v = math.sin(nx + plasma_time) + math.sin(ny + plasma_time * 0.8) + math.sin((nx + ny + plasma_time) * 0.7)
            norm = (v + 3.0) / 6.0
            ch = ASCII_CHARS[int(norm * chars_max)]
            row_chars.append(ch)

            if norm > 0.15:
                if use_color:
                    r = int(128 + 127 * math.sin(norm * 6.28 + plasma_time))
                    g = int(128 + 127 * math.sin(norm * 6.28 + 2.0))
                    b = int(128 + 127 * math.sin(norm * 6.28 + 4.0))
                    ctx.fillStyle = f"rgb({r},{g},{b})"
                else:
                    lum = int(norm * 255)
                    ctx.fillStyle = f"rgb({lum},{lum},{lum})"
                ctx.fillText(ch, x * char_w, pos_y)
        txt_rows.append("".join(row_chars))

    last_txt_frame = "\n".join(txt_rows)
    plasma_time += 0.08

def main_loop(timestamp=0):
    global angle_sun, angle_moon, last_txt_frame

    mode = window.currentAsciiMode
    font_size = int(document.getElementById("fontSize").value)
    use_color = document.getElementById("colorMode").checked

    W = render_canvas.width
    H = render_canvas.height

    ctx.fillStyle = "#030308"
    ctx.fillRect(0, 0, W, H)
    ctx.font = f"bold {font_size}px 'Courier New', monospace"

    if mode == "sun_moon":
        ctx.fillStyle = "#4a5568"
        for s in stars:
            ctx.fillText(s["char"], s["x"], s["y"])

        draw_demo_sphere(W * 0.3, H * 0.5, 195, angle_sun, (255, 185, 50), (0.8, -0.4, 1.0), font_size, use_color)
        draw_demo_sphere(W * 0.7, H * 0.5, 195, angle_moon, (80, 175, 255), (-0.8, -0.3, 0.9), font_size, use_color)

        angle_sun += 0.035
        angle_moon -= 0.025

    elif mode == "donut":
        render_donut(W, H, font_size, use_color)

    elif mode == "matrix":
        render_matrix(W, H, font_size, use_color)

    elif mode == "plasma":
        render_plasma(W, H, font_size, use_color)

    elif mode == "video" and not video.paused and not video.ended and video.videoWidth > 0:
        char_w = max(5, int(font_size * 0.62))
        char_h = font_size

        cols = W // char_w
        rows = H // char_h

        hidden_canvas.width = cols
        hidden_canvas.height = rows
        hidden_ctx.drawImage(video, 0, 0, cols, rows)
        img_data = hidden_ctx.getImageData(0, 0, cols, rows).data

        txt_rows = []
        chars_max = len(ASCII_CHARS) - 1

        for y in range(rows):
            row_str = []
            pos_y = (y + 1) * char_h
            for x in range(cols):
                idx = (y * cols + x) * 4
                r = img_data[idx]
                g = img_data[idx + 1]
                b = img_data[idx + 2]

                lum = int(0.299 * r + 0.587 * g + 0.114 * b)
                ch = ASCII_CHARS[int((lum / 255.0) * chars_max)]
                row_str.append(ch)

                if lum > 12:
                    if use_color:
                        ctx.fillStyle = f"rgb({r},{g},{b})"
                    else:
                        ctx.fillStyle = f"rgb({lum},{lum},{lum})"
                    ctx.fillText(ch, x * char_w, pos_y)
            txt_rows.append("".join(row_str))
        last_txt_frame = "\n".join(txt_rows)

    window.requestAnimationFrame(create_proxy(main_loop))

def download_ascii(event):
    content = last_txt_frame if last_txt_frame else "ASCII Studio Frame"
    blob = Blob.new([content], { "type": "text/plain;charset=utf-8" })
    a = document.createElement("a")
    a.href = URL.createObjectURL(blob)
    a.download = "ascii_art.txt"
    a.click()

main_loop()
  </script>
</body>
</html>
